services:
  - type: web
    name: geumsan-story-proxy
    runtime: node
    rootDir: story-proxy
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PROVIDER
        value: gemini
      # 한 학교 학생들이 같은 인터넷 주소로 접속하므로 반 전체 사용량을 감안한다.
      - key: MAX_PER_MIN
        value: "150"
      # 2.5 모델은 새 사용자에게 막혀 있어 3.x 모델을 쓴다.
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_VIDEO_MODEL
        value: veo-3.1-fast-generate-preview
      - key: GEMINI_THINKING_BUDGET
        value: "0"
      # 이 프록시를 부를 수 있는 앱 주소 (끝 슬래시 없이)
      - key: CORS_ORIGIN
        value: https://geumsan-story.vercel.app
      # 비밀값은 저장소에 두지 않는다. Render 대시보드에서 직접 입력한다.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      # 관리자 계정. ADMIN_PASSWORD_HASH는 비밀번호의 sha256 hex 값이다.
      # 둘 중 하나라도 없으면 로그인이 전부 막힌다(fail-closed).
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
