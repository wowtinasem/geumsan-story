services:
  - type: web
    name: geumsan-story-proxy
    runtime: node
    # 유료 Starter(0.5 CPU, 512MB, 월 7달러). 잠들지 않음. 무료로 되돌아가지 않도록 명시한다.
    plan: starter
    rootDir: story-proxy
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PROVIDER
        value: gemini
      # 학생(로그인) 한 명당 분당 요청 수. 같은 학교도 학생별로 따로 센다.
      - key: MAX_PER_MIN
        value: "60"
      # 그림 모델 분당 한도 100(Google AI Studio 확인) → 여유 두고 90장/분, 동시 16장
      - key: IMAGE_RPM_LIMIT
        value: "90"
      - key: IMAGE_MAX_CONCURRENT
        value: "16"
      # 학생 한 명당: 동화 2편(처음 + 다시 짓기 1번), 그림 14장
      - key: STORY_LIMIT_PER_STUDENT
        value: "2"
      - key: IMAGE_LIMIT_PER_STUDENT
        value: "14"
      # 로그인 토큰 서명용 비밀값. Render가 한 번 만들어 두면 재시작해도 학생 로그인이 유지된다.
      - key: SESSION_SECRET
        generateValue: true
      # 2.5 모델은 새 사용자에게 막혀 있어 3.x 모델을 쓴다.
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_THINKING_BUDGET
        value: "0"
      # 이 프록시를 부를 수 있는 앱 주소 (끝 슬래시 없이)
      - key: CORS_ORIGIN
        value: https://geumsan-story.vercel.app
      # 비밀값은 저장소에 두지 않는다. Render 대시보드에서 직접 입력한다.
      - key: GEMINI_API_KEY
        sync: false
      # 관리자 계정. ADMIN_PASSWORD_HASH는 비밀번호의 sha256 hex 값이다.
      # 둘 중 하나라도 없으면 로그인이 전부 막힌다(fail-closed).
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
